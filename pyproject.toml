[project]
name = "weather"
version = "0.1.0"
description = "Publish NOAA tropical weather imagery to Slack, Discord, and RSS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedgen>=1.0.0",
    "requests-cache>=1.3.2",
    "requests>=2.34.2",
    "slack-sdk>=3.45.0",
    "discord-py>=2.4.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.15.0",
    "pillow>=13.0.0",
    "lxml>=6.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set from 59 to 413 rules. Pin back to
# the previous default so upgrading the tool doesn't silently change what's
# linted. See: https://astral.sh/blog/ruff-v0.16.0#better-default-rule-set
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=weather",
    "--cov-report=term-missing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
weather = "weather.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.coverage.run]
source = ["src/weather"]

[tool.pyright]
include = ["src/weather"]
venvPath = "."
venv = ".venv"
