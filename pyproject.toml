[project]
name = "weather"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argparse>=1.4.0",
    "bs4>=0.0.2",
    "feedgen>=1.0.0",
    "image>=1.5.33",
    "requests-cache>=1.3.2",
    "requests>=2.34.2",
    "slack-sdk>=3.43.0",
    "discord-py>=2.4.0",
    "pytz>=2026.3.post1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.7",
    "pytest>=9.1.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set from 59 to 413 rules. Pin back to
# the previous default so upgrading the tool doesn't silently change what's
# linted. See: https://astral.sh/blog/ruff-v0.16.0#better-default-rule-set
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = [
    ".",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=weather",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.pyright]
    venvPath = "."
    venv = ".venv"
